embedding:
  model_name: "BAAI/bge-small-en-v1.5"
  pooling: "cls"
  query_prefix: "Represent this sentence for searching relevant passages: "
  passage_prefix: ""
  max_seq_length: 512
  batch_size: 32
  normalize: true
  device: null # null = auto-detect (cuda if available, else cpu)

chunking:
  chunk_size: 800
  chunk_overlap: 120

vectorstore:
  persist_directory: "./chroma_db"
  collection_name: "documents"

retrieval:
  top_k: 5
  score_threshold: 0.3

ingest:
  data_dir: "./data"
  auto_ingest: true # wipe the collection and re-ingest data_dir on every startup

llm:
  provider: "groq" # groq | gemini, overridden by LLM_PROVIDER env var
  groq_model: "llama-3.1-8b-instant"
  gemini_model: "gemini-1.5-flash"
  temperature: 0.2
  max_tokens: 1024
